<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Safeguard against browser wallet extension conflicts (MetaMask, Phantom, Coinbase, Rabby, etc.)
      // in cross-origin / sandboxed iframes
      (function() {
        const isWalletExtensionError = function(msg, filename, stack) {
          const text = [msg, filename, stack].filter(Boolean).join(' ');
          return (
            text.includes('Failed to connect to MetaMask') ||
            text.includes('MetaMask') ||
            text.includes('Cannot redefine property: ethereum') ||
            text.includes('Cannot redefine property: solana') ||
            text.includes('Cannot redefine property') ||
            text.includes('chrome-extension://') ||
            text.includes('moz-extension://') ||
            text.includes('inpage.js')
          );
        };

        window.addEventListener('error', function(event) {
          const msg = event && (event.message || (event.error && event.error.message)) || '';
          const filename = (event && event.filename) || '';
          const stack = (event && event.error && event.error.stack) || '';
          if (isWalletExtensionError(msg, filename, stack)) {
            event.stopImmediatePropagation();
            event.stopPropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          const reason = event && event.reason;
          const msg = typeof reason === 'string' ? reason : (reason && reason.message) || '';
          const stack = (reason && reason.stack) || '';
          if (isWalletExtensionError(msg, '', stack)) {
            event.stopImmediatePropagation();
            event.stopPropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        const origDefineProperty = Object.defineProperty;
        Object.defineProperty = function(obj, prop, descriptor) {
          if (obj === window && (prop === 'ethereum' || prop === 'solana')) {
            try {
              return origDefineProperty.call(Object, obj, prop, {
                ...descriptor,
                configurable: true
              });
            } catch (err) {
              return obj;
            }
          }
          return origDefineProperty.apply(Object, arguments);
        };
      })();
    </script>
